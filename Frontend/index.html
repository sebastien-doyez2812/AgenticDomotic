<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agentic Domotic</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050b14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Personnalisation de la scrollbar pour tout le site */
        * {
            scrollbar-width: thin;
            scrollbar-color: #00f0ff rgba(5, 11, 20, 0.7);
        }
        *::-webkit-scrollbar {
            width: 8px;
        }
        *::-webkit-scrollbar-track {
            background: rgba(5, 11, 20, 0.7);
            border-radius: 4px;
        }
        *::-webkit-scrollbar-thumb {
            background-color: #00f0ff;
            border-radius: 4px;
            border: 2px solid rgba(5, 11, 20, 0.7);
        }

        .view {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
            box-sizing: border-box;
        }

        /* PAGE 1 : Accueil Jarvis */
        #landing-view {
            opacity: 1;
            visibility: visible;
            z-index: 10;
        }
        #landing-view.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .reactor-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin-bottom: 30px;
        }

        .core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 50px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 20px #00f0ff, 0 0 40px #00f0ff;
            transform: translate(-50%, -50%) scale(1);
            animation: pulse 2s infinite ease-in-out;
            z-index: 2;
        }

        .ring {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 180px;
            margin-top: -90px;
            margin-left: -90px;
            border: 2px dashed rgba(0, 240, 255, 0.4);
            border-radius: 50%;
            animation: spin 10s linear infinite;
            z-index: 1;
            box-sizing: content-box;
        }

        .prompt {
            font-size: 1.5em;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            font-style: italic;
            text-align: center;
        }

        /* PAGE 2 : Dashboard Plein Écran Absolu */
        #dashboard-view {
            opacity: 0;
            visibility: hidden;
            z-index: 5;
            padding: 20px;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }
        #dashboard-view.visible {
            opacity: 1;
            visibility: visible;
            z-index: 15;
        }

        .dashboard-header {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            padding-bottom: 15px;
        }

        .mini-reactor {
            position: relative;
            width: 50px;
            height: 50px;
            flex-shrink: 0;
        }
        .mini-core {
            position: absolute;
            top: 50%; left: 50%;
            width: 15px; height: 15px;
            background-color: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00f0ff;
            transform: translate(-50%, -50%);
            animation: pulse 2s infinite ease-in-out;
        }
        .mini-ring {
            position: absolute;
            top: 50%; left: 50%;
            width: 40px; height: 40px;
            margin-top: -20px; margin-left: -20px;
            border: 1px dashed rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            animation: spin 8s linear infinite;
        }

        h2 {
            margin: 0;
            font-size: 1.6rem;
            color: #eef0f2;
            letter-spacing: 1px;
        }

        #status-bar {
            font-size: 0.9rem;
            color: #00f0ff;
            font-style: italic;
            margin-top: 4px;
        }

        #chat-box {
            border: 1px solid rgba(0, 240, 255, 0.3);
            background: rgba(5, 11, 20, 0.7);
            box-shadow: inset 0 0 15px rgba(0, 240, 255, 0.1);
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
            padding: 20px;
            margin: 15px 0;
            border-radius: 8px;
            box-sizing: border-box;
        }

        .message {
            margin-bottom: 15px;
            line-height: 1.5;
            font-size: 1.05rem;
        }
        .user { text-align: right; color: #00f0ff; }
        .ai { text-align: left; color: #eef0f2; }

        .input-container {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 6px;
            color: #ffffff;
            font-size: 1.05rem;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #00f0ff;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        button {
            padding: 12px 25px;
            cursor: pointer;
            border-radius: 6px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            background: rgba(0, 240, 255, 0.1);
            color: #00f0ff;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        button:hover {
            background: rgba(0, 240, 255, 0.3);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }

        #continuousBtn.active {
            background-color: rgba(255, 77, 77, 0.2);
            color: #ff4d4d;
            border-color: #ff4d4d;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 15px #00f0ff; }
            50% { transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 30px #00f0ff, 0 0 50px #00f0ff; }
            100% { transform: translate(-50%, -50%) scale(0.9); box-shadow: 0 0 15px #00f0ff; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- PAGE 1 : Accueil Jarvis -->
    <div id="landing-view" class="view">
        <div class="reactor-container">
            <div class="ring"></div>
            <div class="core"></div>
        </div>
        <div class="prompt">Parlez ou bougez la souris pour initialiser l'interface</div>
    </div>

    <!-- PAGE 2 : Dashboard Plein Écran -->
    <div id="dashboard-view" class="view">
        <div class="dashboard-header">
            <div class="mini-reactor">
                <div class="mini-ring"></div>
                <div class="mini-core"></div>
            </div>
            <div>
                <h2>AI Agentic Domotic</h2>
                <div id="status-bar">Système prêt - En attente</div>
            </div>
        </div>
        
        <div id="chat-box"></div>
        
        <div class="input-container">
            <input type="text" id="messageInput" placeholder="Entrez une commande ou activez l'écoute..." onkeypress="checkEnter(event)">
            <button id="continuousBtn" onclick="toggleContinuousMode()">🎙️ Mode Continu</button>
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:9000/ws");
        const landingView = document.getElementById("landing-view");
        const dashboardView = document.getElementById("dashboard-view");
        const chatBox = document.getElementById("chat-box");
        const messageInput = document.getElementById("messageInput");
        const continuousBtn = document.getElementById("continuousBtn");
        const statusBar = document.getElementById("status-bar");

        let isDashboardActive = false;
        let isContinuousActive = false;
        let manualStop = false;
        let isAiSpeaking = false;
        let restartTimeout = null;

        function transitionToDashboard(initialText = "") {
            if (isDashboardActive) return;
            isDashboardActive = true;

            landingView.classList.add("hidden");
            dashboardView.classList.add("visible");

            setTimeout(() => {
                if (initialText) {
                    messageInput.value = initialText;
                    sendMessage();
                }
                if (!isContinuousActive) {
                    toggleContinuousMode();
                }
            }, 600);
        }

        window.addEventListener('mousemove', () => {
            transitionToDashboard();
        }, { once: true });

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            recognition.continuous = false;

            recognition.onstart = function() {
                statusBar.textContent = "État : 🎤 Écoute en cours...";
            };

            recognition.onresult = function(event) {
                if (isAiSpeaking) return;
                const speechText = event.results[0][0].transcript.trim();
                console.log("🗣️ Texte capté :", speechText);

                if (!isDashboardActive) {
                    transitionToDashboard(speechText);
                } else {
                    messageInput.value = speechText;
                    sendMessage();
                }
            };

            recognition.onerror = function(event) {
                if (event.error === 'aborted' || event.error === 'no-speech') return;
                statusBar.textContent = `État : Erreur micro (${event.error})`;
            };

            recognition.onend = function() {
                if (isContinuousActive && !manualStop && !isAiSpeaking) {
                    statusBar.textContent = "État : 🔄 Réinitialisation capteur...";
                    clearTimeout(restartTimeout);
                    restartTimeout = setTimeout(() => {
                        if (isContinuousActive && !manualStop && !isAiSpeaking) {
                            try {
                                recognition.start();
                            } catch (e) {}
                        }
                    }, 400);
                } else if (!isContinuousActive) {
                    statusBar.textContent = "État : En pause";
                }
            };

            try {
                recognition.start();
                isContinuousActive = true;
            } catch (e) {
                console.log("Démarrage auto du micro en attente d'interaction.");
            }
        }

        function toggleContinuousMode() {
            if (!recognition) return;

            isContinuousActive = !isContinuousActive;
            if (isContinuousActive) {
                manualStop = false;
                continuousBtn.classList.add("active");
                continuousBtn.textContent = "🛑 Couper l'écoute";
                try { recognition.start(); } catch (e) {}
            } else {
                manualStop = true;
                continuousBtn.classList.remove("active");
                continuousBtn.textContent = "🎙️ Mode Continu";
                statusBar.textContent = "État : Arrêté manuellement";
                try { recognition.stop(); } catch(e) {}
            }
        }

        ws.onopen = function() {
            console.log("Connecté au WebSocket du backend.");
        };

        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            chatBox.innerHTML += `<div class="message user"><b>Moi :</b> ${data.user_message}</div>`;
            chatBox.innerHTML += `<div class="message ai"><b>IA :</b> ${data.ai_message}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;

            speakText(data.ai_message);
        };

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'fr-FR';
                utterance.rate = 1.0;
                
                utterance.onstart = function() {
                    isAiSpeaking = true;
                    statusBar.textContent = "État : 🤖 Synthèse vocale active...";
                    if (recognition) {
                        try { recognition.stop(); } catch(e) {}
                    }
                };

                utterance.onend = function() {
                    isAiSpeaking = false;
                    if (isContinuousActive && !manualStop && recognition) {
                        setTimeout(() => {
                            try { recognition.start(); } catch(e) {}
                        }, 500);
                    } else {
                        statusBar.textContent = "État : En pause";
                    }
                };

                window.speechSynthesis.speak(utterance);
            }
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (text) {
                ws.send(text);
                messageInput.value = "";
            }
        }

        function checkEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>
</body>
</html>
