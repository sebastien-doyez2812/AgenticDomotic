<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Agent Domotique</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        #chat-box { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9; }
        .message { margin-bottom: 10px; }
        .user { text-align: right; color: #0066cc; }
        .ai { text-align: left; color: #333; }
        input[type="text"] { width: 80%; padding: 8px; }
        button { width: 18%; padding: 8px; }
    </style>
</head>
<body>

    <h2>Assistant Domotique Local</h2>
    <div id="chat-box"></div>
    
    <div style="display: flex; gap: 2px;">
        <input type="text" id="messageInput" placeholder="Ex: Allume la musique ou arrose les plantes..." onkeypress="checkEnter(event)">
        <button onclick="sendMessage()">Envoyer</button>
    </div>

    <script>
        // Connexion au WebSocket sur le port 9000
        const ws = new WebSocket("ws://127.0.0.1:9000/ws");
        const chatBox = document.getElementById("chat-box");

        ws.onopen = function() {
            console.log("Connecté au WebSocket du backend.");
        };

        // Réception des messages du serveur
        ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            // Affichage du message utilisateur
            chatBox.innerHTML += `<div class="message user"><b>Moi :</b> ${data.user_message}</div>`;
            // Affichage de la réponse de l'IA
            chatBox.innerHTML += `<div class="message ai"><b>IA :</b> ${data.ai_message}</div>`;
            
            // Auto-scroll vers le bas
            chatBox.scrollTop = chatBox.scrollHeight;
        };

        ws.onclose = function() {
            console.log("Connexion WebSocket fermée.");
        };

        function sendMessage() {
            const input = document.getElementById("messageInput");
            const text = input.value.trim();
            
            if (text) {
                // Envoi du texte brut au serveur (le backend l'attend via websocket.receive_text)
                ws.send(text);
                input.value = "";
            }
        }

        function checkEnter(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }
    </script>

</body>
</html>
